[project]
name = "protocol-ai-train"
version = "0.1.0"
description = "Next-row model for Protocol AI: trains on the token rows the reader exports"
requires-python = ">=3.12,<3.13"
dependencies = ["torch", "numpy"]

# The RTX 50-series (Blackwell) needs the CUDA 12.8+ builds of PyTorch, which are on this index and not on PyPI.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
